<svg width="680" height="660" viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="660" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">Arquitectura de components React</text>

  <!-- CAPA 0: App -->
  <rect x="40" y="44" width="600" height="56" rx="14" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">App.jsx</text>
  <text x="340" y="86" text-anchor="middle" font-size="11" fill="#5F5E5A">Router + layout global + estat compartit (budgets)</text>

  <!-- Arrows App → Pages -->
  <line x1="200" y1="100" x2="200" y2="130" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="100" x2="480" y2="130" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CAPA 1: Pàgines label -->
  <text x="40" y="122" font-size="11" fill="#5F5E5A">Pàgines</text>

  <!-- HomePage -->
  <rect x="60" y="130" width="260" height="56" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="190" y="153" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">HomePage.jsx</text>
  <text x="190" y="172" text-anchor="middle" font-size="11" fill="#0F6E56">calculadora + formulari + historial</text>

  <!-- BudgetDetailPage -->
  <rect x="360" y="130" width="260" height="56" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="490" y="153" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">BudgetDetailPage.jsx</text>
  <text x="490" y="172" text-anchor="middle" font-size="11" fill="#0F6E56">vista de detall per URL única</text>

  <!-- Arrows Pages → Components -->
  <line x1="120" y1="186" x2="90" y2="246" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="175" y1="186" x2="195" y2="246" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="235" y1="186" x2="315" y2="246" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="186" x2="480" y2="246" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CAPA 2: Components label -->
  <text x="40" y="238" font-size="11" fill="#5F5E5A">Components</text>

  <!-- ServiceList -->
  <rect x="40" y="246" width="140" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="110" y="271" text-anchor="middle" font-size="12" font-weight="500" fill="#26215C">ServiceList</text>
  <text x="110" y="289" text-anchor="middle" font-size="10" fill="#3C3489">llista de tarjetes</text>
  <text x="110" y="305" text-anchor="middle" font-size="10" fill="#3C3489">+ total</text>

  <!-- ClientForm -->
  <rect x="200" y="246" width="140" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="270" y="271" text-anchor="middle" font-size="12" font-weight="500" fill="#26215C">ClientForm</text>
  <text x="270" y="289" text-anchor="middle" font-size="10" fill="#3C3489">nom, email,</text>
  <text x="270" y="305" text-anchor="middle" font-size="10" fill="#3C3489">telèfon</text>

  <!-- BudgetList -->
  <rect x="360" y="246" width="140" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="430" y="271" text-anchor="middle" font-size="12" font-weight="500" fill="#26215C">BudgetList</text>
  <text x="430" y="289" text-anchor="middle" font-size="10" fill="#3C3489">historial +</text>
  <text x="430" y="305" text-anchor="middle" font-size="10" fill="#3C3489">cerca</text>

  <!-- BudgetDetail -->
  <rect x="520" y="246" width="140" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="590" y="271" text-anchor="middle" font-size="12" font-weight="500" fill="#26215C">BudgetDetail</text>
  <text x="590" y="289" text-anchor="middle" font-size="10" fill="#3C3489">detall complet</text>
  <text x="590" y="305" text-anchor="middle" font-size="10" fill="#3C3489">+ URL</text>

  <!-- Arrows to subcomponents -->
  <line x1="110" y1="316" x2="110" y2="376" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="316" x2="430" y2="376" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CAPA 3: Subcomponents label -->
  <text x="40" y="368" font-size="11" fill="#5F5E5A">Subcomponents</text>

  <!-- ServiceCard -->
  <rect x="40" y="376" width="152" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="116" y="401" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C">ServiceCard</text>
  <text x="116" y="419" text-anchor="middle" font-size="10" fill="#712B13">checkbox + preu</text>
  <text x="116" y="435" text-anchor="middle" font-size="10" fill="#712B13">+ WebConfigurator</text>

  <!-- WebConfigurator -->
  <rect x="208" y="376" width="152" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="284" y="401" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C">WebConfigurator</text>
  <text x="284" y="419" text-anchor="middle" font-size="10" fill="#712B13">pàgines + idiomes</text>
  <text x="284" y="435" text-anchor="middle" font-size="10" fill="#712B13">contador</text>

  <!-- BudgetCard -->
  <rect x="376" y="376" width="152" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="452" y="401" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C">BudgetCard</text>
  <text x="452" y="419" text-anchor="middle" font-size="10" fill="#712B13">resum: nom, data</text>
  <text x="452" y="435" text-anchor="middle" font-size="10" fill="#712B13">serveis, total</text>

  <!-- ServiceCard → WebConfigurator -->
  <line x1="192" y1="411" x2="208" y2="411" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>

  <!-- Separator line -->
  <line x1="40" y1="476" x2="640" y2="476" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- CAPA 4: Serveis label -->
  <text x="40" y="492" font-size="11" fill="#5F5E5A">Serveis i hooks</text>

  <!-- useBudgets -->
  <rect x="40" y="500" width="180" height="70" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="130" y="525" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">useBudgets.js</text>
  <text x="130" y="543" text-anchor="middle" font-size="10" fill="#5F5E5A">custom hook</text>
  <text x="130" y="559" text-anchor="middle" font-size="10" fill="#5F5E5A">llegir / guardar</text>

  <!-- budgetService -->
  <rect x="240" y="500" width="180" height="70" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="330" y="525" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">budgetService.js</text>
  <text x="330" y="543" text-anchor="middle" font-size="10" fill="#5F5E5A">buildBudget()</text>
  <text x="330" y="559" text-anchor="middle" font-size="10" fill="#5F5E5A">calculateTotal()</text>

  <!-- generateId -->
  <rect x="440" y="500" width="180" height="70" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="530" y="525" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">generateId.js</text>
  <text x="530" y="543" text-anchor="middle" font-size="10" fill="#5F5E5A">uuid únic</text>
  <text x="530" y="559" text-anchor="middle" font-size="10" fill="#5F5E5A">per pressupost</text>

  <!-- Legend -->
  <rect x="40" y="598" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="60" y="609" font-size="11" fill="#5F5E5A">Pàgines</text>
  <rect x="130" y="598" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="150" y="609" font-size="11" fill="#5F5E5A">Components</text>
  <rect x="252" y="598" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="272" y="609" font-size="11" fill="#5F5E5A">Subcomponents</text>
  <rect x="390" y="598" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="410" y="609" font-size="11" fill="#5F5E5A">Serveis / hooks</text>

  <text x="340" y="640" text-anchor="middle" font-size="10" fill="#888780">La línia discontínua separa UI (dalt) de lògica pura (baix)</text>
</svg>
