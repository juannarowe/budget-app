<svg width="680" height="820" viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="820" fill="#ffffff"/>

  <!-- TITLE -->
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">User Flow — Budget App</text>

  <!-- LEGEND -->
  <rect x="40" y="44" width="14" height="14" rx="2" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="60" y="55" font-size="11" fill="#5F5E5A">Flux client</text>
  <rect x="140" y="44" width="14" height="14" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="160" y="55" font-size="11" fill="#5F5E5A">Flux historial</text>
  <rect x="260" y="44" width="14" height="14" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="280" y="55" font-size="11" fill="#5F5E5A">Decisió</text>

  <!-- DIVIDER -->
  <line x1="350" y1="60" x2="350" y2="790" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- ===== FLUX CLIENT (esquerra) ===== -->
  <!-- START -->
  <rect x="100" y="70" width="180" height="40" rx="20" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="190" y="94" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Entra a la app</text>
  <line x1="190" y1="110" x2="190" y2="135" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Veu serveis -->
  <rect x="90" y="135" width="200" height="50" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="190" y="155" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Veu els serveis</text>
  <text x="190" y="173" text-anchor="middle" font-size="11" fill="#0F6E56">SEO, Ads, Web</text>
  <line x1="190" y1="185" x2="190" y2="215" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Selecciona -->
  <rect x="90" y="215" width="200" height="50" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="190" y="235" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Selecciona serveis</text>
  <text x="190" y="253" text-anchor="middle" font-size="11" fill="#0F6E56">checkboxes</text>
  <line x1="190" y1="265" x2="190" y2="295" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decisió Web -->
  <polygon points="190,295 285,325 190,355 95,325" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="190" y="321" text-anchor="middle" font-size="11" fill="#444441">Web</text>
  <text x="190" y="336" text-anchor="middle" font-size="11" fill="#444441">seleccionada?</text>

  <!-- Sí -->
  <line x1="190" y1="355" x2="190" y2="385" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="375" font-size="11" fill="#1D9E75">Sí</text>

  <!-- Configura Web -->
  <rect x="90" y="385" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="190" y="408" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Configura Web</text>
  <text x="190" y="428" text-anchor="middle" font-size="11" fill="#0F6E56">pàgines + idiomes × 30€</text>
  <line x1="190" y1="441" x2="190" y2="471" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- No bypass -->
  <path d="M285 325 L320 325 L320 486 L290 486" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow3)"/>
  <text x="295" y="318" font-size="11" fill="#888780">No</text>

  <!-- Preu total -->
  <rect x="90" y="471" width="200" height="50" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="190" y="491" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Veu preu total</text>
  <text x="190" y="509" text-anchor="middle" font-size="11" fill="#0F6E56">càlcul en temps real</text>
  <line x1="190" y1="521" x2="190" y2="551" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Formulari -->
  <rect x="90" y="551" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="190" y="574" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Omple formulari</text>
  <text x="190" y="594" text-anchor="middle" font-size="11" fill="#0F6E56">nom, email, telèfon</text>
  <line x1="190" y1="607" x2="190" y2="637" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sol·licita -->
  <rect x="90" y="637" width="200" height="50" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="190" y="657" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Sol·licita pressupost</text>
  <text x="190" y="675" text-anchor="middle" font-size="11" fill="#0F6E56">genera ID únic + URL</text>
  <line x1="190" y1="687" x2="190" y2="717" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- END -->
  <rect x="90" y="717" width="200" height="50" rx="25" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="190" y="737" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Veu pressupost</text>
  <text x="190" y="755" text-anchor="middle" font-size="11" fill="#5F5E5A">URL compartible</text>

  <!-- ===== FLUX HISTORIAL (dreta) ===== -->
  <rect x="400" y="70" width="200" height="40" rx="20" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="500" y="94" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Consulta historial</text>
  <line x1="500" y1="110" x2="500" y2="140" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="390" y="140" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="500" y="163" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">Veu llistat</text>
  <text x="500" y="181" text-anchor="middle" font-size="11" fill="#3C3489">nom, data, total, serveis</text>
  <line x1="500" y1="196" x2="500" y2="226" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="390" y="226" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="500" y="249" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">Cerca / filtra</text>
  <text x="500" y="267" text-anchor="middle" font-size="11" fill="#3C3489">per nom, data, import</text>
  <line x1="500" y1="282" x2="500" y2="312" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="390" y="312" width="220" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="500" y="332" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">Obre pressupost</text>
  <text x="500" y="350" text-anchor="middle" font-size="11" fill="#3C3489">detall complet</text>
  <line x1="500" y1="362" x2="500" y2="392" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="390" y="392" width="220" height="50" rx="25" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="500" y="412" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">Comparteix URL</text>
  <text x="500" y="430" text-anchor="middle" font-size="11" fill="#5F5E5A">o exporta PDF (bonus)</text>

  <!-- Footer labels -->
  <text x="190" y="800" text-anchor="middle" font-size="11" fill="#888780">Flux 1: Client potencial</text>
  <text x="500" y="800" text-anchor="middle" font-size="11" fill="#888780">Flux 2: Equip comercial</text>
</svg>
