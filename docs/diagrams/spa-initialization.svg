<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="460" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">Inicialització de la SPA amb React</text>

  <!-- Step 1 -->
  <rect x="200" y="44" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="67" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">Navegador carrega index.html</text>
  <text x="340" y="86" text-anchor="middle" font-size="11" fill="#5F5E5A">només conté &lt;div id="root"&gt;</text>
  <text x="500" y="67" font-size="10" fill="#1D9E75">arxiu estàtic</text>
  <line x1="200" y1="60" x2="195" y2="60" stroke="#e5e7eb" stroke-width="0.5"/>
  <line x1="340" y1="100" x2="340" y2="130" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="200" y="130" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="153" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">main.jsx munta la app</text>
  <text x="340" y="172" text-anchor="middle" font-size="11" fill="#0F6E56">ReactDOM.render(&lt;App /&gt;, root)</text>
  <text x="500" y="153" font-size="10" fill="#5F5E5A">punt d'entrada</text>
  <line x1="340" y1="186" x2="340" y2="216" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="200" y="216" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="239" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">React Router llegeix la URL</text>
  <text x="340" y="258" text-anchor="middle" font-size="11" fill="#0F6E56">ruta "/" → renderitza HomePage</text>
  <text x="500" y="239" font-size="10" fill="#5F5E5A">navegació sense recàrrega</text>
  <line x1="340" y1="272" x2="340" y2="302" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="200" y="302" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="325" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">useEffect carrega l'historial</text>
  <text x="340" y="344" text-anchor="middle" font-size="11" fill="#0F6E56">localStorage o JSON server</text>
  <text x="500" y="325" font-size="10" fill="#5F5E5A">efecte al muntar</text>
  <line x1="340" y1="358" x2="340" y2="388" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 5 -->
  <rect x="180" y="388" width="320" height="56" rx="28" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="411" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">Usuari veu la pantalla</text>
  <text x="340" y="430" text-anchor="middle" font-size="11" fill="#5F5E5A">Hero + Serveis + Formulari + Historial</text>
</svg>
